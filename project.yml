name: SpicyLyrics
options:
  bundleIdPrefix: com.spicylyrics.unofficial
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  # Creates SpicyLyrics/Generated/BundledKeys+Generated.swift so it exists before the project is generated.
  preGenCommand: scripts/generate-bundled-keys.sh

packages:
  # App Remote: the exact playback position straight from the Spotify app on this phone.
  SpotifyiOS:
    url: https://github.com/spotify/ios-sdk
    from: 5.0.1

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Overridden by CI: alpha / release / pr. Local builds are "dev".
    SPICY_CHANNEL: dev

targets:
  SpicyLyrics:
    type: application
    platform: iOS
    scheme: {}
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    preBuildScripts:
      - name: Bundle build-time keys
        script: '"${SRCROOT}/scripts/generate-bundled-keys.sh"'
        basedOnDependencyAnalysis: false
    sources:
      - path: SpicyLyrics
    dependencies:
      - package: SpotifyiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spicylyrics.unofficial.ios
        PRODUCT_NAME: SpicyLyrics
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: K684596528
        # The key script reads Config/Secrets.xcconfig and writes into the source tree.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    info:
      path: SpicyLyrics/Info.plist
      properties:
        CFBundleDisplayName: Spicy Lyrics
        CFBundleLocalizations:
          - en
          - ru
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SpicyLyricsChannel: $(SPICY_CHANNEL)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.spicylyrics.unofficial.ios.auth
            CFBundleURLSchemes:
              - spicylyrics-ios
        LSApplicationQueriesSchemes:
          - spotify
        ITSAppUsesNonExemptEncryption: false
        # Picture in Picture lyrics keep running while the app is in the background.
        UIBackgroundModes:
          - audio
